name: 自动测试

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        run: |
          # 由 Runner 自动处理，无需额外操作
          echo "代码已检出到工作目录"
          ls -la

      - name: Python 语法检查
        run: |
          echo "=== Python 语法检查 ==="
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" | while read f; do
            if python3 -m py_compile "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ $f 语法错误"
            fi
          done
          echo "语法检查完成"

      - name: 运行测试
        run: |
          echo "=== 运行测试 ==="
          if [ -d "tests" ] && [ "$(find tests -name '*.py' | wc -l)" -gt 0 ]; then
            pip3 install pytest --quiet 2>/dev/null
            python3 -m pytest tests/ --tb=short -v
          else
            echo "⚠️ tests/ 目录为空，跳过测试"
            echo "提示：创建 tests/test_*.py 后 CI 会自动运行"
          fi

      - name: 代码统计
        run: |
          echo "=== 代码统计 ==="
          echo "Python 文件数: $(find . -name '*.py' -not -path './.venv/*' | wc -l)"
          echo "总代码行数: $(find . -name '*.py' -not -path './.venv/*' | xargs wc -l 2>/dev/null | tail -1)"
          echo "测试文件数: $(find tests -name '*.py' 2>/dev/null | wc -l)"
